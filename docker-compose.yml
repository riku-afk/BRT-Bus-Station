# Local services. Postgres only — no Redis / S3 in the POC.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: brt_bus_station
    ports: ['5432:5432']
    volumes: [pgdata:/var/lib/postgresql/data]

volumes:
  pgdata:
