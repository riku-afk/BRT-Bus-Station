<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f172a" />
    <title>BRT Konduktor</title>
    <style>
      html, body { height: 100%; margin: 0; }
      body { display: grid; place-items: center; background: #0f172a; color: #e2e8f0; font-family: system-ui, sans-serif; padding: 24px; box-sizing: border-box; text-align: center; }
      main { max-width: 340px; display: grid; gap: 14px; justify-items: center; }
      .logo { width: 64px; height: 64px; border-radius: 18px; background: #facc15; color: #0f172a; display: grid; place-items: center; font-size: 30px; font-weight: 800; }
      h1 { margin: 0; font-size: 22px; }
      p { margin: 0; color: #94a3b8; line-height: 1.5; font-size: 15px; }
      button { height: 52px; width: 100%; border: 0; border-radius: 14px; background: #4f46e5; color: #fff; font: inherit; font-size: 16px; font-weight: 800; }
    </style>
  </head>
  <body>
    <main>
      <div class="logo" aria-hidden="true">B</div>
      <h1>Can’t reach BRT</h1>
      <p>Check that this phone has a mobile or Wi-Fi connection, then try again.</p>
      <button type="button" onclick="location.href = '__BRT_URL__'">Try again</button>
    </main>
  </body>
</html>
